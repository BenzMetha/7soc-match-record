<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Football League Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--green:#00C853;--green2:#00E676;--dark:#0A0F0D;--card:#111916;--border:#1E2B22;--muted:#4A6152;--text:#E8F5E9;}
*{box-sizing:border-box;}
body{font-family:'Kanit',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden;}
.font-display{font-family:'Barlow Condensed',sans-serif;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.6;}
.screen-enter{animation:screenEnter .28s ease forwards;}
@keyframes screenEnter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.screen-back{animation:screenBack .28s ease forwards;}
@keyframes screenBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.tab-btn{flex:1;padding:.6rem .5rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;}
.tab-btn.active{color:var(--green);border-color:var(--green);}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,transform .15s;}
.card:active{transform:scale(.98);}
.league-card{display:flex;align-items:center;gap:1rem;padding:1rem;cursor:pointer;transition:border-color .15s,background .15s;}
.league-card:active{background:rgba(0,200,83,.04);transform:scale(.99);}
.stand-row{transition:background .15s;}
.stand-row:hover{background:rgba(0,200,83,.04);}
.badge-g{background:rgba(0,200,83,.15);color:var(--green2);}
.badge-y{background:rgba(255,214,0,.12);color:#FFD600;}
.badge-r{background:rgba(229,57,53,.15);color:#EF5350;}
.badge-a{background:rgba(33,150,243,.12);color:#42A5F5;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.4,1);padding-bottom:env(safe-area-inset-bottom,16px);}
.modal-overlay.open .modal-box{transform:translateY(0);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-dot{animation:pulse 1.4s infinite;}
@keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,var(--card) 25%,var(--border) 50%,var(--card) 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:6px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.player-chip{display:flex;flex-direction:column;align-items:center;padding:.4rem;text-align:center;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s;background:var(--dark);}
.player-chip.selected{border-color:var(--green);background:rgba(0,200,83,.08);}
.player-chip .chip-img{width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--card);border:1px solid var(--border);margin-bottom:.35rem;}
.player-chip .chip-img img{width:100%;height:100%;object-fit:cover;}
.player-chip .chip-name{font-size:.7rem;font-weight:600;line-height:1.2;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-chip .chip-num{font-size:.65rem;color:var(--muted);}
.score-input{width:56px;text-align:center;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:.4rem;color:var(--text);font-size:1.4rem;font-weight:700;-moz-appearance:textfield;}
.score-input::-webkit-inner-spin-button,.score-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.score-input:focus{outline:none;border-color:var(--green);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .35s ease forwards;}
.logo-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;color:var(--green);}

/* ── Knockout Bracket ── */
.bracket-wrapper{overflow-x:auto;padding-bottom:.5rem;}
.bracket-round-label{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:.5rem;}
.bracket-match{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:140px;}
.bracket-team{display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;transition:background .15s;}
.bracket-team.winner{background:rgba(0,200,83,.08);}
.bracket-team.loser{opacity:.45;}
.bracket-team-name{font-size:.7rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bracket-score{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.95rem;min-width:18px;text-align:right;}
.bracket-score.winner-score{color:var(--green);}
.bracket-divider{height:1px;background:var(--border);}
/* connector lines */
.bracket-connector{display:flex;align-items:center;}
.bracket-connector-lines{display:flex;flex-direction:column;justify-content:space-around;}
.cup-tab-btn{flex:1;padding:.4rem .5rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;border:1px solid var(--border);color:var(--muted);transition:all .15s;}
.cup-tab-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,200,83,.08);}
</style>
</head>
<body>

<!-- ╔════════════════════════════╗ -->
<!-- ║        SCREEN: HOME        ║ -->
<!-- ╚════════════════════════════╝ -->
<div id="screen-home" class="relative z-10 min-h-screen">
  <header class="px-5 pt-10 pb-6">
    <div class="flex items-end justify-between">
      <div>
        <p class="text-xs text-green-500 font-display font-bold tracking-widest uppercase mb-1">FOOTBALL</p>
        <h1 class="font-display font-black leading-none text-white" style="font-size:2.8rem">LEAGUE<br><span class="text-green-500">HUB</span></h1>
      </div>
      <div class="w-14 h-14 rounded-2xl bg-green-500/10 border border-green-500/20 flex items-center justify-center mb-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00C853" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
        </svg>
      </div>
    </div>
    <p class="text-sm text-[#4A6152] mt-3">เลือก League ที่ต้องการจัดการ</p>
  </header>
  <div class="px-3 pb-10">
    <p class="text-[10px] font-display font-bold tracking-widest uppercase text-[#4A6152] px-1 mb-2">ALL LEAGUES</p>
    <div id="leagues-list" class="space-y-2"></div>
  </div>
</div>

<!-- ╔════════════════════════════╗ -->
<!-- ║       SCREEN: LEAGUE       ║ -->
<!-- ╚════════════════════════════╝ -->
<div id="screen-league" class="hidden">
  <header class="sticky top-0 z-20 px-4 pt-5 pb-3" style="background:var(--dark);border-bottom:1px solid var(--border)">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="goHome()" class="w-9 h-9 rounded-full bg-[#1E2B22] flex items-center justify-center text-[#4A6152] hover:text-green-400 transition shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/></svg>
        </button>
        <div class="min-w-0">
          <p class="text-xs text-green-500 font-display font-bold tracking-widest uppercase" id="league-subtitle">LEAGUE</p>
          <h1 class="font-display font-black text-2xl leading-none text-white truncate" id="league-title">LOADING...</h1>
        </div>
      </div>
      <div id="league-logo-header" class="w-10 h-10 rounded-full overflow-hidden bg-green-500/10 border border-green-500/30 flex items-center justify-center text-green-400 shrink-0"></div>
    </div>
    <nav class="flex border-b border-[#1E2B22]">
      <button class="tab-btn active" onclick="switchTab('standings',this)">STANDING</button>
      <button class="tab-btn" onclick="switchTab('matches',this)">MATCHES</button>
      <button class="tab-btn" onclick="switchTab('scorers',this)">STATS</button>
    </nav>
  </header>

  <!-- Tab: Standings -->
  <section id="tab-standings" class="tab-content relative z-10 px-2 py-3 fade-up">
    <div id="standings-header" class="flex items-center px-3 py-1 text-[10px] font-display font-bold tracking-widest uppercase text-[#4A6152] mb-1">
      <span class="w-6 text-center">#</span>
      <span class="flex-1 ml-2">TEAMS</span>
      <span class="w-7 text-center">MP</span>
      <span class="w-7 text-center">W</span>
      <span class="w-7 text-center">D</span>
      <span class="w-7 text-center">L</span>
      <span class="w-8 text-center">GD</span>
      <span class="w-8 text-center font-black text-green-500">PTS</span>
    </div>
    <div id="standings-list" class="space-y-1"></div>
  </section>

  <!-- Tab: Matches -->
  <section id="tab-matches" class="tab-content hidden relative z-10 px-3 py-3">
    <div class="relative mb-3">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-[#4A6152]" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.656a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
      <input id="match-search" type="text" placeholder="ค้นหาชื่อทีม..." oninput="renderMatches(allMatches)"
        class="w-full bg-[#111916] border border-[#1E2B22] rounded-xl pl-8 pr-4 py-2 text-sm text-[#E8F5E9] placeholder-[#4A6152] focus:outline-none focus:border-green-500 transition"/>
    </div>
    <div class="flex gap-2 mb-3 overflow-x-auto pb-1">
      <button id="filter-all"      class="match-filter-btn text-xs font-display font-bold px-3 py-1 rounded-full border border-green-500 text-green-400 whitespace-nowrap" onclick="filterMatches('all')">ALL</button>
      <button id="filter-today"    class="match-filter-btn text-xs font-display font-bold px-3 py-1 rounded-full border border-[#1E2B22] text-[#4A6152] whitespace-nowrap" onclick="filterMatches('today')">TODAY</button>
      <button id="filter-upcoming" class="match-filter-btn text-xs font-display font-bold px-3 py-1 rounded-full border border-[#1E2B22] text-[#4A6152] whitespace-nowrap" onclick="filterMatches('upcoming')">UPCOMING</button>
      <button id="filter-ft"       class="match-filter-btn text-xs font-display font-bold px-3 py-1 rounded-full border border-[#1E2B22] text-[#4A6152] whitespace-nowrap" onclick="filterMatches('ft')">FULL-TIME</button>
    </div>
    <div id="matches-list" class="space-y-3"></div>
  </section>

  <!-- Tab: Scorers -->
  <section id="tab-scorers" class="tab-content hidden relative z-10 px-3 py-3">
    <div id="scorers-list" class="space-y-3"></div>
  </section>
</div>

<!-- Modals -->
<div id="match-modal"      class="modal-overlay" onclick="closeModalOutside(event,'match-modal')">  <div class="modal-box"><div class="flex justify-center pt-3 pb-1"><div class="w-10 h-1 rounded-full bg-[#2E3D34]"></div></div><div id="modal-content"       class="px-4 pb-6"></div></div></div>
<div id="event-form-modal" class="modal-overlay" onclick="closeModalOutside(event,'event-form-modal')" style="z-index:60"><div class="modal-box"><div class="flex justify-center pt-3 pb-1"><div class="w-10 h-1 rounded-full bg-[#2E3D34]"></div></div><div id="event-form-content" class="px-4 pb-6"></div></div></div>
<div id="stats-modal"      class="modal-overlay" onclick="closeModalOutside(event,'stats-modal')">  <div class="modal-box"><div class="flex justify-center pt-3 pb-1"><div class="w-10 h-1 rounded-full bg-[#2E3D34]"></div></div><div id="stats-modal-content"  class="px-4 pb-6"></div></div></div>
<div id="player-modal"     class="modal-overlay" onclick="closeModalOutside(event,'player-modal')"> <div class="modal-box"><div class="flex justify-center pt-3 pb-1"><div class="w-10 h-1 rounded-full bg-[#2E3D34]"></div></div><div id="player-modal-content" class="px-4 pb-6"></div></div></div>
<div id="team-modal"       class="modal-overlay" onclick="closeModalOutside(event,'team-modal')">   <div class="modal-box"><div class="flex justify-center pt-3 pb-1"><div class="w-10 h-1 rounded-full bg-[#2E3D34]"></div></div><div id="team-modal-content"   class="px-4 pb-6"></div></div></div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-4 py-2 rounded-full bg-green-500 text-black font-bold text-sm opacity-0 pointer-events-none transition-opacity duration-300 whitespace-nowrap"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────────
const API_URL = 'https://script.google.com/macros/s/AKfycbyak4t2zMp7OED8eYMSZbTMFPywu-vPM2bURQCCYZytCZFpbkdKrntSkPSCRIZvmEbANA/exec';

// ── STATE ────────────────────────────────────────────────────
let allMatches   = [], allPlayers   = [], allTeams   = [], allScorers = [];
let statsCache   = {}, currentFilter = 'all';
let activeModal  = null, currentLeague = null;
let selectedEvPlayer = null, selectedEvPlayerId = null, selectedEvSide = 'home';

// ── INIT ─────────────────────────────────────────────────────
window.onload = () => loadLeagues();

// ============================================================
// HOME
// ============================================================
async function loadLeagues() {
  document.getElementById('leagues-list').innerHTML = [1,2,3].map(()=>`
    <div class="card flex items-center gap-4 p-4">
      <div class="shimmer w-14 h-14 rounded-xl shrink-0"></div>
      <div class="flex-1 space-y-2"><div class="shimmer h-2.5 w-20 rounded"></div><div class="shimmer h-4 w-40 rounded"></div></div>
    </div>`).join('');
  const leagues = await api('getLeagues');
  renderLeagues(leagues || []);
}

function renderLeagues(leagues) {
  const el = document.getElementById('leagues-list');
  if (!leagues.length) { el.innerHTML='<p class="text-center text-[#4A6152] py-12 text-sm">ยังไม่มี League</p>'; return; }
  el.innerHTML = leagues.map(lg => {
    const isCup = lg.is_cup === true || String(lg.is_cup).toUpperCase() === 'TRUE';
    return `
    <div class="card league-card" onclick='selectLeague(${JSON.stringify(lg)})'>
      <div class="w-14 h-14 rounded-xl overflow-hidden border border-[#1E2B22] bg-[#0A0F0D] shrink-0">
        ${lg.league_logo ? `<img src="${lg.league_logo}" class="w-full h-full object-cover"/>` : `<div class="logo-fallback text-xl">${initials(lg.league_name)}</div>`}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-0.5">
          <p class="text-[10px] font-display font-bold tracking-widest text-green-500 uppercase">${lg.league_day||''}</p>
          ${isCup ? '<span class="text-[9px] font-display font-bold px-1.5 py-0.5 rounded bg-yellow-500/20 text-yellow-400">CUP</span>' : ''}
        </div>
        <h3 class="font-display font-black text-lg text-white leading-tight truncate">${lg.league_name}</h3>
        <div class="flex items-center gap-2 mt-0.5">
          ${lg.teams_count  ? `<span class="text-[11px] text-[#4A6152]">⚽ ${lg.teams_count} ทีม</span>` : ''}
          ${lg.matches_count? `<span class="text-[11px] text-[#4A6152]">· ${lg.matches_count} นัด</span>` : ''}
        </div>
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#2E3D34" viewBox="0 0 16 16" class="shrink-0"><path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/></svg>
    </div>`;
  }).join('');
}

function selectLeague(lg) {
  currentLeague = lg;
  document.getElementById('league-subtitle').textContent = lg.league_subtitle || lg.league_day || '';
  document.getElementById('league-title').textContent    = lg.league_name;
  const logoEl = document.getElementById('league-logo-header');
  logoEl.innerHTML = lg.league_logo
    ? `<img src="${lg.league_logo}" class="w-full h-full object-cover"/>`
    : `<span class="font-display font-black text-sm">${initials(lg.league_name)}</span>`;

  document.querySelectorAll('.tab-content').forEach(s=>s.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-standings').classList.remove('hidden');
  document.querySelector('.tab-btn').classList.add('active');

  document.getElementById('screen-home').classList.add('hidden');
  const ls = document.getElementById('screen-league');
  ls.classList.remove('hidden');
  ls.classList.add('screen-enter');
  setTimeout(()=>ls.classList.remove('screen-enter'), 320);
  loadAll(lg.league_id);
}

function goHome() {
  currentLeague = null;
  allMatches=[]; allPlayers=[]; allTeams=[]; allScorers=[];
  document.getElementById('screen-league').classList.add('hidden');
  const hs = document.getElementById('screen-home');
  hs.classList.remove('hidden');
  hs.classList.add('screen-back');
  setTimeout(()=>hs.classList.remove('screen-back'), 320);
}

// ============================================================
// DATA
// ============================================================
function isCup() {
  return currentLeague && (currentLeague.is_cup === true || String(currentLeague.is_cup).toUpperCase() === 'TRUE');
}

function applyData(d) {
  allMatches = d.matches  || [];
  allPlayers = d.players  || [];
  allTeams   = d.teams    || [];
  allScorers = d.scorers  || [];

  if (d.is_cup || isCup()) {
    renderCupStandings(d.group_standings || [], d.knockout || []);
  } else {
    document.getElementById('standings-header').style.display = '';
    renderStandings(d.standings || []);
  }
  renderMatches(allMatches);
  renderScorers(allScorers);
}

async function loadAll(leagueId) {
  const ckey = 'lh_' + leagueId;
  const raw  = localStorage.getItem(ckey);
  if (raw) { try { applyData(JSON.parse(raw)); } catch(e){} }
  else {
    ['standings-list','matches-list','scorers-list'].forEach(id=>showShimmer(id,6));
  }
  const d = await api('getInitialData', { leagueId });
  if (d && !d.error) {
    applyData(d);
    try { localStorage.setItem(ckey, JSON.stringify(d)); } catch(e){}
  }
}

// ── API ──────────────────────────────────────────────────────
async function api(action, params={}) {
  const qs  = new URLSearchParams({ action, ...params });
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}
async function apiWrite(action, data) {
  const payload = { ...data, league_id: currentLeague?.league_id };
  const qs  = new URLSearchParams({ action, data: JSON.stringify(payload) });
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}

// ── TABS ─────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(s=>s.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  document.getElementById('tab-'+name).classList.add('fade-up');
  btn.classList.add('active');
}
function showShimmer(id,n){
  document.getElementById(id).innerHTML = Array(n).fill(0).map(()=>'<div class="shimmer h-12 w-full mb-2"></div>').join('');
}

// ============================================================
// RENDER: STANDINGS (league ปกติ)
// ============================================================
function renderStandings(data) {
  const el = document.getElementById('standings-list');
  if (!data.length){el.innerHTML='<p class="text-center text-[#4A6152] py-8">ยังไม่มีข้อมูล</p>';return;}
  el.innerHTML = data.map((t,i)=>{
    const hl  = i===0 ? 'border-l-2 border-green-500':'';
    const pos = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
    return `
    <div class="stand-row card flex items-center px-3 py-2.5 cursor-pointer ${hl}" onclick="openTeamModal('${esc(t.team_name)}')">
      <span class="w-6 text-center text-xs font-bold text-[#4A6152]">${pos}</span>
      <div class="flex items-center gap-2 flex-1 ml-2 min-w-0">
        ${logoImg(t.logo,t.team_name,24)}
        <span class="font-semibold text-sm truncate">${t.team_name}</span>
      </div>
      <span class="w-7 text-center text-xs text-[#4A6152]">${t.MP}</span>
      <span class="w-7 text-center text-xs text-green-400">${t.W}</span>
      <span class="w-7 text-center text-xs text-[#4A6152]">${t.D}</span>
      <span class="w-7 text-center text-xs text-red-400">${t.L}</span>

// ── Knockout Bracket HTML ─────────────────────────────────────
function renderKnockoutBracket(rounds) {
  // แสดงเป็น visual bracket แนวนอน
  if (!rounds.length) return '<p class="text-center text-[#4A6152] py-8">ยังไม่มีข้อมูล</p>';

  // ตรวจว่ามีมากกว่า 1 รอบหรือไม่ — ถ้า 1 รอบก็แสดงแบบ list เรียบง่าย
  if (rounds.length === 1) return singleRoundHTML(rounds[0]);

  // มีหลายรอบ → bracket layout แนวนอน
  return `
  <div class="bracket-wrapper pb-4">
    <div class="flex gap-4 items-start" style="min-width:${rounds.length*160}px">
      ${rounds.map(r => roundColumn(r)).join('')}
    </div>
  </div>
  ${rounds.map(r=>bracketRoundLegend(r)).join('')}`;
}

function roundColumn(r) {
  const roundLabel = roundDisplayName(r.round);
  return `
  <div class="flex flex-col" style="min-width:148px">
    <p class="bracket-round-label mb-2">${roundLabel}</p>
    <div class="flex flex-col gap-3 flex-1 justify-around">
      ${r.matches.map(m=>bracketMatchCard(m)).join('')}
    </div>
  </div>`;
}

function bracketMatchCard(m) {
  const isFT     = m.status==='FT'||m.status==='Finished';
  const hs       = Number(m.home_score), as = Number(m.away_score);
  const homeWin  = isFT && hs > as;
  const awayWin  = isFT && as > hs;
  const homeLogo = logoImgRaw(teamLogo(m.home_team), m.home_team, 20);
  const awayLogo = logoImgRaw(teamLogo(m.away_team), m.away_team, 20);

  return `
  <div class="bracket-match cursor-pointer hover:border-green-500/40 transition" onclick='openModal(${JSON.stringify(m)})'>
    <div class="bracket-team ${homeWin?'winner':awayWin?'loser':''}">
      ${homeLogo}
      <span class="bracket-team-name">${m.home_team}</span>
      <span class="bracket-score ${homeWin?'winner-score':''}">${isFT?hs:'-'}</span>
    </div>
    <div class="bracket-divider"></div>
    <div class="bracket-team ${awayWin?'winner':homeWin?'loser':''}">
      ${awayLogo}
      <span class="bracket-team-name">${m.away_team}</span>
      <span class="bracket-score ${awayWin?'winner-score':''}">${isFT?as:'-'}</span>
    </div>
    ${!isFT&&m.match_date?`<p class="text-[9px] text-[#4A6152] text-center py-1">${formatDate(m.match_date)}</p>`:''}
  </div>`;
}

function singleRoundHTML(r) {
  return `
  <div class="mb-4">
    <p class="font-display font-bold text-xs tracking-widest uppercase text-[#4A6152] px-1 mb-3">${roundDisplayName(r.round)}</p>
    <div class="space-y-2">${r.matches.map(m=>bracketMatchCard(m)).join('')}</div>
  </div>`;
}

function bracketRoundLegend(r) { return ''; } // placeholder

function roundDisplayName(r) {
  const map = { R32:'Round of 32', R16:'Round of 16', QF:'Quarter Final', SF:'Semi Final', '3RD':'3rd Place', F:'FINAL', FINAL:'FINAL' };
  return map[r] || r;
}

function renderMatches(data) {
  const el       = document.getElementById('matches-list');
  const search   = (document.getElementById('match-search')?.value||'').trim().toLowerCase();
  const todayStr = (() => { const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); })();

  let filtered = data;
  if (currentFilter==='today')    filtered = data.filter(m=>m.match_date===todayStr);
  if (currentFilter==='upcoming') filtered = data.filter(m=>m.status!=='FT'&&m.status!=='Finished');
  if (currentFilter==='ft')       filtered = data.filter(m=>m.status==='FT'||m.status==='Finished');
  if (search) filtered = filtered.filter(m=>
    m.home_team?.toLowerCase().includes(search)||m.away_team?.toLowerCase().includes(search));

  if (!filtered.length){el.innerHTML='<p class="text-center text-[#4A6152] py-8">ไม่พบแมตช์</p>';return;}

  const byDate={};
  filtered.forEach(m=>{ const d=m.match_date||'TBD'; if(!byDate[d])byDate[d]=[]; byDate[d].push(m); });

  el.innerHTML = Object.entries(byDate).map(([date,ms])=>`
    <div>
      <p class="text-[10px] font-display font-bold tracking-widest uppercase text-[#4A6152] px-1 mb-2">${formatDate(date)}</p>
      <div class="space-y-2">${ms.map(m=>matchCard(m)).join('')}</div>
    </div>`).join('');
}

function matchCard(m) {
  const isFT  = m.status==='FT'||m.status==='Finished';
  const isLive= m.status==='LIVE';
  const isKO  = String(m.round_type||'').toLowerCase()==='knockout';
  const badge = isFT
    ? `<span class="text-[10px] font-display font-bold text-[#4A6152] bg-[#1A2420] px-2 py-0.5 rounded">FT</span>`

      ? `<span class="flex items-center gap-1 text-[10px] font-display font-bold text-green-400 bg-green-500/10 px-2 py-0.5 rounded"><span class="live-dot w-1.5 h-1.5 rounded-full bg-green-400 inline-block"></span>LIVE</span>`
      : `<span class="text-[10px] font-display font-bold text-[#4A6152]">${m.match_time||'TBD'}</span>`;
  const roundTag = m.round_type
    ? `<span class="text-[9px] font-display font-bold px-1.5 py-0.5 rounded ${isKO?'bg-yellow-500/15 text-yellow-400':'bg-[#1E2B22] text-[#4A6152]'}">${isKO?(m.group_name||'KO'):'GP-'+m.group_name}</span>`
    : '';
  return `
  <div class="card p-3 cursor-pointer" onclick='openModal(${JSON.stringify(m)})'>
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-1.5">${roundTag}<span class="text-[10px] text-[#4A6152] font-display">${m.venue||''}</span></div>
      ${badge}
    </div>
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2 flex-1 min-w-0">
        ${logoImg(teamLogo(m.home_team),m.home_team,32)}
        <span class="font-semibold text-sm truncate">${m.home_team}</span>
      </div>
      <div class="flex items-center gap-1.5 px-3 shrink-0">
        ${isFT||isLive
          ? `<span class="font-display font-black text-xl text-white">${m.home_score}</span><span class="font-display text-[#4A6152] font-bold">:</span><span class="font-display font-black text-xl text-white">${m.away_score}</span>`
          : `<span class="font-display font-bold text-base text-[#2E3D34]">vs</span>`}
      </div>
      <div class="flex items-center gap-2 flex-1 min-w-0 justify-end">
        <span class="font-semibold text-sm truncate text-right">${m.away_team}</span>
        ${logoImg(teamLogo(m.away_team),m.away_team,32)}

    </div>
    ${isFT&&m.home_possession&&m.away_possession?`

      <div class="flex h-1 rounded-full overflow-hidden bg-[#1E2B22]"><div class="bg-green-500" style="width:${m.home_possession}%"></div><div class="bg-blue-500" style="width:${m.away_possession}%"></div></div>
    </div>`:''}
  </div>`;
}

function renderScorers(data) {
  const el = document.getElementById('scorers-list');
  if (!data.length){el.innerHTML='<p class="text-center text-[#4A6152] py-8">ยังไม่มีข้อมูล</p>';return;}

  function pRow(p,i,bc,sk) {
    return `
    <div class="card flex items-center gap-3 p-3 mb-1 cursor-pointer hover:border-green-500/30 transition" onclick="openPlayerModal('${p.player_id}')">
      <span class="font-display font-black text-xl w-6 text-center ${i===0?'text-green-400':i===1?'text-gray-400':i===2?'text-amber-600':'text-[#2E3D34]'}">${i+1}</span>

      </div>
      <div class="flex-1 min-w-0"><p class="font-semibold text-sm truncate">${p.player_name}</p><p class="text-[11px] text-[#4A6152] truncate">${p.team_name}</p></div>
      <span class="${bc} text-sm font-black px-3 py-1 rounded-full">${p[sk]}</span>
    </div>`;
  }

  function group(title, icon, arr, sk, bc) {
    const f = arr.filter(p=>p[sk]>0).sort((a,b)=>b[sk]-a[sk]);
    if (!f.length) return '';
    const top = f.slice(0,10);
    const ck  = 'stats_'+sk;
    statsCache[ck] = { title, icon, players:f, statKey:sk, badgeClass:bc };
    return `
    <div class="mb-5">
      <p class="font-display font-bold text-xs tracking-widest uppercase text-[#4A6152] mb-2 px-1">${icon} ${title}</p>
      ${top.map((p,i)=>pRow(p,i,bc,sk)).join('')}
      ${f.length>10?`<button onclick="openStatsModal('${ck}')" class="w-full mt-1 py-2 text-xs font-display font-bold text-[#4A6152] hover:text-green-400 border border-[#1E2B22] hover:border-green-500/30 rounded-xl transition">VIEW MORE (${f.length-10} คน)</button>`:''}
    </div>`;
  }

  el.innerHTML =
    group('Top Scorer','⚽',data,'goals','badge-g') +
    group('Top Assist','🅰',data,'assists','badge-a') +
    group('Top Saves','🧤',data,'saves','badge-a') +
    group('ใบเหลือง','🟨',data,'yellow','badge-y') +
    group('ใบแดง','🟥',data,'red','badge-r') +
    group('Own Goal','🔴',data,'owngoal','badge-r');
}

async function saveScore() {
  const hs=document.getElementById('home-score').value;
  const as=document.getElementById('away-score').value;
  const status=document.getElementById('match-status').value;
  const hp=document.getElementById('home-possession')?.value;
  const ap=document.getElementById('away-possession')?.value;
  if(hs===''||as===''){showToast('กรุณากรอกคะแนนก่อน');return;}
  const res = await apiWrite('saveMatchResult',{
    match_id:activeModal.match_id,home_score:Number(hs),away_score:Number(as),
    status,home_possession:hp,away_possession:ap,
  });
  if(res.success){
    const m=allMatches.find(m=>String(m.match_id)===String(activeModal.match_id));
    if(m){m.home_score=Number(hs);m.away_score=Number(as);m.status=status;if(hp)m.home_possession=Number(hp);if(ap)m.away_possession=Number(ap);}
    showToast('บันทึกผลสำเร็จ ✅');
    closeModalById('match-modal');
    const ckey='lh_'+currentLeague?.league_id; localStorage.removeItem(ckey);
    const fd=await api('getInitialData',{leagueId:currentLeague?.league_id});
    if(fd&&!fd.error){applyData(fd);try{localStorage.setItem(ckey,JSON.stringify(fd));}catch(e){}}
  } else { showToast('เกิดข้อผิดพลาด ❌'); }
}

async function deleteEventItem(matchId,playerId,playerName,type,time){
  const res=await apiWrite('deleteEvent',{match_id:matchId,player_id:playerId,player_name:playerName,type,time});
  if(res.success){
    showToast('ลบ Event สำเร็จ ✅');
    const events=await api('getEvents',{matchId});
    document.getElementById('event-log').innerHTML=events.map(e=>eventRow(e)).join('')||'<p class="text-xs text-[#4A6152]">ยังไม่มี Event</p>';
  } else { showToast('ลบไม่สำเร็จ ❌'); }
}

      <div>
        <label class="text-[10px] text-[#4A6152] mb-1 block">นาที</label>
        <input type="number" id="ev-time" placeholder="เช่น 45" min="1" max="120"
          class="w-full bg-[#0A0F0D] border border-[#1E2B22] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500"/>
      </div>
    </div>
    <div class="flex gap-2 mb-2">
      <button id="ev-tab-home" class="ev-team-tab flex-1 text-xs font-display font-bold py-1.5 rounded-lg border border-green-500 text-green-400 bg-green-500/10" onclick="switchEvTab('home')">${match.home_team}</button>
      <button id="ev-tab-away" class="ev-team-tab flex-1 text-xs font-display font-bold py-1.5 rounded-lg border border-[#1E2B22] text-[#4A6152]" onclick="switchEvTab('away')">${match.away_team}</button>
    </div>
    <div id="ev-players-home" class="grid grid-cols-3 gap-2 max-h-64 overflow-y-auto mb-3">${playerChips(hPlayers,'home')}</div>
    <div id="ev-players-away" class="hidden grid grid-cols-3 gap-2 max-h-64 overflow-y-auto mb-3">${playerChips(aPlayers,'away')}</div>
    <button id="btn-confirm-event" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold font-display py-2.5 rounded-xl transition">บันทึก Event</button>`;

  document.getElementById('btn-confirm-event').onclick = ()=>addEvent(match.home_team,match.away_team);
  document.getElementById('event-form-modal').classList.add('open');
}

function switchEvTab(side) {
  selectedEvSide=side; selectedEvPlayer=null; selectedEvPlayerId=null;
  document.querySelectorAll('.ev-team-tab').forEach(b=>{
    b.classList.remove('border-green-500','text-green-400','bg-green-500/10');
    b.classList.add('border-[#1E2B22]','text-[#4A6152]');
  });
  document.getElementById('ev-tab-'+side).classList.add('border-green-500','text-green-400','bg-green-500/10');
  document.getElementById('ev-tab-'+side).classList.remove('border-[#1E2B22]','text-[#4A6152]');
  document.getElementById('ev-players-home').classList.toggle('hidden',side!=='home');
  document.getElementById('ev-players-away').classList.toggle('hidden',side!=='away');
}

function selectPlayer(side,name,pid){
  document.querySelectorAll('.player-chip').forEach(c=>c.classList.remove('selected'));
  selectedEvPlayer=name; selectedEvPlayerId=pid;
  const chip=document.getElementById('chip-'+side+'-'+pid);
  if(chip) chip.classList.add('selected');
}

async function addEvent(homeTeam,awayTeam){
  if(!selectedEvPlayer){showToast('กรุณาเลือกผู้เล่นก่อน');return;}
  const type=document.getElementById('ev-type').value;
  const time=document.getElementById('ev-time').value;
  const teamName=selectedEvSide==='home'?homeTeam:awayTeam;
  const ev={type,player_id:selectedEvPlayerId,player_name:selectedEvPlayer,team_name:teamName,time:time||'',match_id:activeModal.match_id};
  const res=await apiWrite('saveEvent',ev);
  if(res.success){
    document.getElementById('event-form-modal').classList.remove('open');
    showToast('บันทึก Event สำเร็จ ✅');
    const events=await api('getEvents',{matchId:activeModal.match_id});
    document.getElementById('event-log').innerHTML=events.map(e=>eventRow(e)).join('')||'<p class="text-xs text-[#4A6152]">ยังไม่มี Event</p>';
    selectedEvPlayer=null;
  } else { showToast('เกิดข้อผิดพลาด ❌'); }
}

function playerChips(players,side){
  if(!players.length) return '<p class="text-xs text-[#4A6152] col-span-3 py-2">ไม่มีผู้เล่น</p>';
  return players.map(p=>`
    <div class="player-chip" id="chip-${side}-${p.player_id}" onclick="selectPlayer('${side}','${esc(p.player_name)}','${p.player_id}')">
      <div class="chip-img">${p.player_image?`<img src="${p.player_image}"/>`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.25rem;color:#00C853">${initials(p.player_name)}</div>`}</div>
      <p class="chip-name">${p.player_name}</p>
      <p class="chip-num">#${p.player_number||'-'}</p>
    </div>`).join('');
}

// ============================================================
// STATS VIEW MORE
// ============================================================
function openStatsModal(cacheKey){
  const c=statsCache[cacheKey]; if(!c){showToast('ไม่พบข้อมูล');return;}
  const el=document.getElementById('stats-modal-content');
  el.innerHTML=`
    <p class="font-display font-bold text-sm tracking-widest uppercase text-[#4A6152] mb-3 mt-2">${c.icon} ${c.title} — ทั้งหมด</p>
    ${c.players.map((p,i)=>`
    <div class="card flex items-center gap-3 p-3 mb-1 cursor-pointer hover:border-green-500/30 transition" onclick="closeModalById('stats-modal');openPlayerModal('${p.player_id}')">
      <span class="font-display font-black text-xl w-6 text-center ${i===0?'text-green-400':i===1?'text-gray-400':i===2?'text-amber-600':'text-[#2E3D34]'}">${i+1}</span>
      <div class="w-10 h-10 rounded-full overflow-hidden border border-[#1E2B22] shrink-0 bg-[#0A0F0D]">
        ${p.player_image?`<img src="${p.player_image}" class="w-full h-full object-cover"/>`:`<div class="logo-fallback text-xs">${initials(p.player_name)}</div>`}
      </div>
      <div class="flex-1 min-w-0"><p class="font-semibold text-sm truncate">${p.player_name}</p><p class="text-[11px] text-[#4A6152] truncate">${p.team_name}</p></div>
      <span class="${c.badgeClass} text-sm font-black px-3 py-1 rounded-full">${p[c.statKey]}</span>
    </div>`).join('')}`;
  document.getElementById('stats-modal').classList.add('open');
}

// ============================================================
// PLAYER PROFILE MODAL
// ============================================================
function openPlayerModal(playerId){
  if(!playerId||playerId==='undefined'){showToast('ไม่พบ ID ผู้เล่น');return;}
  const p=allPlayers.find(x=>String(x.player_id)===String(playerId));
  if(!p){showToast('ไม่พบข้อมูลผู้เล่น');return;}
  const s=allScorers.find(x=>String(x.player_id)===String(playerId))||{};
  document.getElementById('player-modal-content').innerHTML=`
    <div class="flex flex-col items-center pt-4 pb-2">
      <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-green-500/30 bg-[#0A0F0D] mb-3">
        ${p.player_image?`<img src="${p.player_image}" class="w-full h-full object-cover"/>`:`<div class="logo-fallback text-2xl">${initials(p.player_name)}</div>`}
      </div>
      <h2 class="font-display font-black text-2xl text-white">${p.player_name}</h2>
      <p class="text-sm text-[#4A6152] mb-1">${p.team_name}</p>
      ${p.player_number?`<p class="text-xs text-green-400 font-bold">#${p.player_number}</p>`:''}
      ${p.player_position?`<span class="mt-1 text-[10px] font-display font-bold px-3 py-0.5 rounded-full bg-green-500/10 text-green-400">${p.player_position}</span>`:''}
    </div>
    <div class="grid grid-cols-3 gap-2 mt-3 mb-2">
      ${[['goals','⚽','text-green-400'],['assists','🅰','text-blue-400'],['owngoal','🔴','text-red-400']].map(([k,icon,col])=>`
      <div class="card flex flex-col items-center py-3"><span class="text-2xl font-black ${col}">${s[k]||0}</span><span class="text-[10px] text-[#4A6152] mt-0.5">${icon}</span></div>`).join('')}
    </div>
    <div class="grid grid-cols-3 gap-2">
      ${[['yellow','🟨','text-yellow-400'],['red','🟥','text-red-600'],['saves','🧤','text-blue-300']].map(([k,icon,col])=>`
      <div class="card flex flex-col items-center py-3"><span class="text-2xl font-black ${col}">${s[k]||0}</span><span class="text-[10px] text-[#4A6152] mt-0.5">${icon}</span></div>`).join('')}
    </div>`;
  document.getElementById('player-modal').classList.add('open');
}

// ============================================================
// TEAM MODAL
// ============================================================
function openTeamModal(teamName){
  const team=allTeams.find(t=>t.team_name===teamName)||{};
  const players=allPlayers.filter(p=>p.team_name===teamName);
  const smap={}; allScorers.forEach(s=>{smap[s.player_id]=s;});
  let W=0,D=0,L=0,F=0,A=0;
  allMatches.filter(m=>(m.status==='FT'||m.status==='Finished')&&(m.home_team===teamName||m.away_team===teamName))
    .forEach(m=>{
      const hs=Number(m.home_score),as=Number(m.away_score);
      const ih=m.home_team===teamName; const gf=ih?hs:as,ga=ih?as:hs;
      F+=gf;A+=ga;if(gf>ga)W++;else if(gf<ga)L++;else D++;
    });
  document.getElementById('team-modal-content').innerHTML=`
    <div class="flex flex-col items-center pt-4 pb-3">
      <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-green-500/30 bg-[#0A0F0D] mb-3">
        ${team.logo?`<img src="${team.logo}" class="w-full h-full object-cover"/>`:`<div class="logo-fallback text-2xl">${initials(teamName)}</div>`}
      </div>
      <h2 class="font-display font-black text-2xl text-white mb-1">${teamName}</h2>
      <div class="flex gap-4 text-center mt-1 mb-4">
        <div><p class="text-xl font-black text-green-400">${W}</p><p class="text-[10px] text-[#4A6152]">W</p></div>
        <div><p class="text-xl font-black text-[#4A6152]">${D}</p><p class="text-[10px] text-[#4A6152]">D</p></div>
        <div><p class="text-xl font-black text-red-400">${L}</p><p class="text-[10px] text-[#4A6152]">L</p></div>
        <div><p class="text-xl font-black text-white">${F}-${A}</p><p class="text-[10px] text-[#4A6152]">GF-GA</p></div>
      </div>
    </div>
    <p class="font-display font-bold text-xs tracking-widest uppercase text-[#4A6152] mb-2 px-1">⚽ ผู้เล่น (${players.length} คน)</p>
    <div class="grid grid-cols-3 gap-2">
      ${players.length?players.map(p=>{
        const s=smap[p.player_id]||{};
        return `
        <div class="card p-2 flex flex-col items-center text-center cursor-pointer hover:border-green-500/40 transition" onclick="closeModalById('team-modal');openPlayerModal('${p.player_id}')">
          <div class="w-full aspect-square rounded-lg overflow-hidden border border-[#1E2B22] bg-[#0A0F0D] mb-1.5">
            ${p.player_image?`<img src="${p.player_image}" class="w-full h-full object-cover"/>`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;color:#00C853">${initials(p.player_name)}</div>`}
          </div>
          <p class="text-xs font-semibold leading-tight truncate w-full">${p.player_name}</p>
          <p class="text-[10px] text-[#4A6152] mb-1">#${p.player_number||'-'}</p>
          <div class="flex flex-wrap gap-1 justify-center">
            ${s.goals  ?`<span class="badge-g text-[10px] font-bold px-1.5 py-0.5 rounded-full">⚽${s.goals}</span>`:''}
            ${s.assists?`<span class="badge-a text-[10px] font-bold px-1.5 py-0.5 rounded-full">🅰${s.assists}</span>`:''}
            ${s.saves  ?`<span class="badge-a text-[10px] font-bold px-1.5 py-0.5 rounded-full">🧤${s.saves}</span>`:''}
            ${s.yellow ?`<span class="badge-y text-[10px] font-bold px-1.5 py-0.5 rounded-full">🟨${s.yellow}</span>`:''}
            ${s.red    ?`<span class="badge-r text-[10px] font-bold px-1.5 py-0.5 rounded-full">🟥${s.red}</span>`:''}
          </div>
        </div>`;}).join(''):'<p class="text-xs text-[#4A6152] col-span-3 py-2">ยังไม่มีผู้เล่น</p>'}
    </div>`;
  document.getElementById('team-modal').classList.add('open');
}

// ============================================================
// MODAL HELPERS
// ============================================================
function closeModalById(id){ document.getElementById(id).classList.remove('open'); }
function closeModalOutside(e,id){ if(e.target===document.getElementById(id)) closeModalById(id); }

// ============================================================
// HELPERS
// ============================================================
function teamLogo(n){ const t=allTeams.find(t=>t.team_name===n); return t?t.logo:''; }

function logoImg(url,name,size){
  const s=`width:${size}px;height:${size}px;border-radius:${size/2}px;overflow:hidden;background:#0A0F0D;border:1px solid #1E2B22;flex-shrink:0;`;
  if(url) return `<div style="${s}"><img src="${url}" style="width:100%;height:100%;object-fit:cover;"/></div>`;
  return `<div style="${s}display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:${Math.round(size*.35)}px;color:#00C853;">${initials(name)}</div>`;
}

function logoImgRaw(url,name,size){
  const s=`width:${size}px;height:${size}px;border-radius:${size/2}px;overflow:hidden;background:#0A0F0D;border:1px solid #1E2B22;flex-shrink:0;`;
  if(url) return `<div style="${s}"><img src="${url}" style="width:100%;height:100%;object-fit:cover;"/></div>`;
  return `<div style="${s}display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:${Math.round(size*.4)}px;color:#00C853;">${initials(name)}</div>`;
}

function initials(name){ if(!name)return'?'; return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function esc(s){ return String(s||'').replace(/'/g,"\\'"); }
function formatDate(ds){
  if(!ds||ds==='TBD')return'TBD';
  try{ const[y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('th-TH',{weekday:'short',month:'short',day:'numeric'}); }
  catch{return ds;}
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  setTimeout(()=>{t.style.opacity='0';},2200);
}
</script>
</body>
</html>
