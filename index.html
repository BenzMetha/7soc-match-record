window.__early = null;
try {
  window.__early = fetch(API_URL + '?action=getLeagues')
    .then(function (r) { return r.json(); })
    .catch(function () { return null; });
} catch (e) {}
</script>

<style>
:root{--green:#00C853;--green2:#00E676;--dark:#0A0F0D;--card:#111916;--border:#1E2B22;--muted:#4A6152;--text:#E8F5E9;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--dark);-webkit-text-size-adjust:100%;}
body{font-family:'Kanit','Noto Sans Thai','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden;}
.font-display{font-family:'Barlow Condensed','Kanit',system-ui,sans-serif;}
.screen-enter{animation:screenEnter .28s ease forwards;}
@keyframes screenEnter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.screen-back{animation:screenBack .28s ease forwards;}
@keyframes screenBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.tab-btn{flex:1;padding:.6rem .5rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;}
.tab-btn.active{color:var(--green);border-color:var(--green);}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,transform .15s;}
.card:active{transform:scale(.98);}
.league-card{display:flex;align-items:center;gap:1rem;padding:1rem;cursor:pointer;transition:border-color .15s,background .15s;}
.league-card:active{background:rgba(0,200,83,.04);transform:scale(.99);}
.stand-row{transition:background .15s;}
.stand-row:hover{background:rgba(0,200,83,.04);}
.badge-g{background:rgba(0,200,83,.15);color:var(--green2);}
.badge-y{background:rgba(255,214,0,.12);color:#FFD600;}
.badge-r{background:rgba(229,57,53,.15);color:#EF5350;}
.badge-a{background:rgba(33,150,243,.12);color:#42A5F5;}

/* Modal: ตอนปิดใช้ visibility:hidden และไม่มี blur (เครื่องอ่อนไม่ต้องคำนวณ) */
.modal-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-end;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s linear .3s;}
.modal-overlay.open{opacity:1;visibility:visible;pointer-events:all;transition:opacity .25s,visibility 0s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.4,1);padding-bottom:env(safe-area-inset-bottom,16px);}
.modal-overlay.open .modal-box{transform:translateY(0);}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-dot{animation:pulse 1.4s infinite;}
@keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,var(--card) 25%,var(--border) 50%,var(--card) 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:6px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.player-chip{display:flex;flex-direction:column;align-items:center;padding:.4rem;text-align:center;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s;background:var(--dark);}
.player-chip.selected{border-color:var(--green);background:rgba(0,200,83,.08);}
.player-chip .chip-img{width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--card);border:1px solid var(--border);margin-bottom:.35rem;}
.player-chip .chip-img img{width:100%;height:100%;object-fit:cover;}
.player-chip .chip-name{font-size:.7rem;font-weight:600;line-height:1.2;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-chip .chip-num{font-size:.65rem;color:var(--muted);}
.score-input{width:56px;text-align:center;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:.4rem;color:var(--text);font-size:1.4rem;font-weight:700;-moz-appearance:textfield;}
.score-input::-webkit-inner-spin-button,.score-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.score-input:focus{outline:none;border-color:var(--green);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .35s ease forwards;}
.logo-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;color:var(--green);}
button:disabled{opacity:.6;}

/* ── Knockout Bracket ── */
.bracket-wrapper{overflow-x:auto;padding-bottom:.5rem;}
.bracket-round-label{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:.5rem;}
.bracket-match{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:140px;}
.bracket-team{display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;transition:background .15s;}
.bracket-team.winner{background:rgba(0,200,83,.08);}
.bracket-team.loser{opacity:.45;}
.bracket-team-name{font-size:.7rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bracket-score{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.95rem;min-width:18px;text-align:right;}
.bracket-score.winner-score{color:var(--green);}
.bracket-divider{height:1px;background:var(--border);}
.cup-tab-btn{flex:1;padding:.4rem .5rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;border:1px solid var(--border);color:var(--muted);transition:all .15s;}
.cup-tab-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,200,83,.08);}
</style>
</head>
<body>

    <div class="flex items-end justify-between">

        <p class="text-xs text-green-500 font-display font-bold tracking-widest uppercase mb-1">FOOTBALL</p>

<div id="screen-league" class="hidden">
  <header class="sticky top-0 z-20 px-4 pt-5 pb-3" style="background:var(--dark);border-bottom:1px solid var(--border)">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3 min-w-0">

          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/></svg>

  <!-- Tab: Standings -->

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-4 py-2 rounded-full bg-green-500 text-black font-bold text-sm opacity-0 pointer-events-none transition-opacity duration-300 whitespace-nowrap"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────────
// API_URL ถูกประกาศไว้ใน <head> แล้ว (เพื่อยิง request แรกให้เร็วที่สุด)

// ── STATE ────────────────────────────────────────────────────
let allLeagues = [], allMatches = [], allPlayers = [], allTeams = [], allScorers = [];
let logoMap = {}, statsCache = {}, currentFilter = 'all', scorersTeamFilter = 'all';
let activeModal = null, currentLeague = null, busy = false;
let selectedEvPlayer = null, selectedEvPlayerId = null, selectedEvSide = 'home';
let editingPlayerId = null, editingTeamName = null, editingLeagueId = null, pendingPhoto = null;

// ── SAFE STORAGE (บาง in-app browser โยน error เมื่อแตะ localStorage) ──
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

// ── INIT ─────────────────────────────────────────────────────
loadLeagues();

// ============================================================
// HOME
// ============================================================
function wait(ms){ return new Promise(function(r){ setTimeout(function(){ r(null); }, ms); }); }

async function loadLeagues() {
  const cached = lsGet('lh_leagues');
  let shown = false;
  if (cached) {
    try {
      const c = JSON.parse(cached);
      if (Array.isArray(c) && c.length) { renderLeagues(c); shown = true; }
    } catch(e){}
  }

  let leagues = null;
  if (window.__early) {
    leagues = await Promise.race([window.__early, wait(12000)]);
    window.__early = null;
  }
  if (!Array.isArray(leagues)) {
    try { leagues = await api('getLeagues'); } catch(e){ leagues = null; }
  }

  if (Array.isArray(leagues)) {
    const fresh = JSON.stringify(leagues);
    if (fresh !== cached || !shown) renderLeagues(leagues);
    if (leagues.length) lsSet('lh_leagues', fresh);
  } else if (!shown) {
    document.getElementById('leagues-list').innerHTML =
      '<div class="text-center py-12 px-4"><p class="text-sm text-[#4A6152] mb-3">โหลดรายการ League ไม่สำเร็จ</p>' +
      '<button onclick="loadLeagues()" class="text-xs font-display font-bold px-4 py-2 rounded-full border border-green-500 text-green-400">ลองใหม่</button></div>';
  }
}

function isCupObj(l) { return !!l && (l.is_cup === true || String(l.is_cup).toUpperCase() === 'TRUE'); }

function renderLeagues(leagues) {
  allLeagues = leagues;
  const el = document.getElementById('leagues-list');
  if (!leagues.length) { el.innerHTML='<p class="text-center text-[#4A6152] py-12 text-sm">ยังไม่มี League</p>'; return; }
  el.innerHTML = leagues.map(function(lg) {
    const cup = isCupObj(lg);
    return `
    <div class="card league-card" onclick="selectLeagueById('${esc(lg.league_id)}')">
      <div class="w-14 h-14 rounded-xl overflow-hidden border border-[#1E2B22] bg-[#0A0F0D] shrink-0">
        ${lg.league_logo ? imgTag(lg.league_logo,112,'w-full h-full object-cover','',initials(lg.league_name),'1.25rem') : `<div class="logo-fallback text-xl">${initials(lg.league_name)}</div>`}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-0.5">
          <p class="text-[10px] font-display font-bold tracking-widest text-green-500 uppercase">${lg.league_day||''}</p>
          ${cup ? '<span class="text-[9px] font-display font-bold px-1.5 py-0.5 rounded bg-yellow-500/20 text-yellow-400">CUP</span>' : ''}
        </div>
        <h3 class="font-display font-black text-lg text-white leading-tight truncate">${lg.league_name}</h3>
        <div class="flex items-center gap-2 mt-0.5">
          ${lg.teams_count  ? `<span class="text-[11px] text-[#4A6152]">⚽ ${lg.teams_count} ทีม</span>` : ''}
          ${lg.matches_count? `<span class="text-[11px] text-[#4A6152]">· ${lg.matches_count} นัด</span>` : ''}
        </div>
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#2E3D34" viewBox="0 0 16 16" class="shrink-0"><path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/></svg>
    </div>`;
  }).join('');
}

function selectLeagueById(id) {
  const lg = allLeagues.find(function(l){ return String(l.league_id) === String(id); });
  if (lg) selectLeague(lg);
}

function selectLeague(lg) {
  currentLeague = lg;
  document.getElementById('league-subtitle').textContent = lg.league_subtitle || lg.league_day || '';
  document.getElementById('league-title').textContent    = lg.league_name;
  const logoEl = document.getElementById('league-logo-header');
  logoEl.innerHTML = lg.league_logo
    ? imgTag(lg.league_logo,112,'w-full h-full object-cover','',initials(lg.league_name),'.875rem')
    : `<span class="font-display font-black text-sm">${initials(lg.league_name)}</span>`;

  document.querySelectorAll('.tab-content').forEach(function(s){ s.classList.add('hidden'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('tab-standings').classList.remove('hidden');
  document.querySelector('.tab-btn').classList.add('active');

  document.getElementById('screen-home').classList.add('hidden');
  const ls = document.getElementById('screen-league');
  ls.classList.remove('hidden');
  ls.classList.add('screen-enter');
  setTimeout(function(){ ls.classList.remove('screen-enter'); }, 320);
  loadAll(lg.league_id);
}

function goHome() {
  currentLeague = null;
  allMatches=[]; allPlayers=[]; allTeams=[]; allScorers=[]; logoMap={};
  document.getElementById('screen-league').classList.add('hidden');
  const hs = document.getElementById('screen-home');
  hs.classList.remove('hidden');
  hs.classList.add('screen-back');
  setTimeout(function(){ hs.classList.remove('screen-back'); }, 320);
}

// ============================================================
// DATA
// ============================================================
function isCup() { return isCupObj(currentLeague); }

function applyData(d) {
  allMatches = d.matches  || [];
  allPlayers = d.players  || [];
  allTeams   = d.teams    || [];
  allScorers = d.scorers  || [];
  logoMap = {};
  allTeams.forEach(function(t){ logoMap[t.team_name] = t.logo; });

  if (d.is_cup || isCup()) {
    renderCupStandings(d.group_standings || [], d.knockout || []);
  } else {
    document.getElementById('standings-header').style.display = '';
    renderStandings(d.standings || []);
  }
  renderMatches(allMatches);
  renderScorersTeamOptions();
  renderScorers(allScorers);
}

// เติม option ของ dropdown filter ทีมในแท็บ Stats ตามทีมของลีกที่เปิดอยู่
// ถ้าทีมที่เลือกไว้ (ของลีกก่อนหน้า) ไม่มีในลีกนี้ ให้รีเซ็ตกลับเป็น "ทั้งหมด"
function renderScorersTeamOptions() {
  const sel = document.getElementById('scorers-team-select');
  if (!sel) return;
  const teams = allTeams.slice().sort(function(a,b){ return String(a.team_name).localeCompare(String(b.team_name),'th'); });
  const stillValid = teams.some(function(t){ return t.team_name === scorersTeamFilter; });
  if (!stillValid) scorersTeamFilter = 'all';
  sel.innerHTML = '<option value="all">ทั้งหมด (ทุกทีม)</option>' +
    teams.map(function(t){ return '<option value="'+ea(t.team_name)+'">'+ea(t.team_name)+'</option>'; }).join('');
  sel.value = scorersTeamFilter;
}

function filterScorersByTeam(teamName) {
  scorersTeamFilter = teamName || 'all';
  renderScorers(allScorers);
}

function showLoadError(leagueId) {
  const html = '<div class="text-center py-10 px-4"><p class="text-sm text-[#4A6152] mb-3">โหลดข้อมูลไม่สำเร็จ</p>' +
    '<button onclick="loadAll(\'' + esc(leagueId) + '\')" class="text-xs font-display font-bold px-4 py-2 rounded-full border border-green-500 text-green-400">ลองใหม่</button></div>';
  ['standings-list','matches-list','scorers-list'].forEach(function(id){ document.getElementById(id).innerHTML = html; });
}

async function loadAll(leagueId) {
  const ckey = 'lh_' + leagueId;
  const raw  = lsGet(ckey);
  let shown  = false;
  if (raw) { try { applyData(JSON.parse(raw)); shown = true; } catch(e){} }
  if (!shown) ['standings-list','matches-list','scorers-list'].forEach(function(id){ showShimmer(id,6); });

  const stillHere = function(){ return currentLeague && String(currentLeague.league_id) === String(leagueId); };
  try {
    const d = await api('getInitialData', { leagueId: leagueId });
    if (!stillHere()) return;                       // ผู้ใช้กลับหน้าแรก/เปลี่ยนลีกไปแล้ว
    if (d && !d.error) { applyData(d); lsSet(ckey, JSON.stringify(d)); }
    else if (!shown) showLoadError(leagueId);
  } catch(e) {
    if (stillHere() && !shown) showLoadError(leagueId);
  }
}

// ── API ──────────────────────────────────────────────────────
// อ่าน: timeout 20 วิ + ลองซ้ำ 1 ครั้ง / เขียน: ไม่ลองซ้ำ (กันข้อมูลซ้ำ)
async function api(action, params, opt) {
  params = params || {};
  const tries   = (opt && opt.retry === false) ? 1 : 2;
  const timeout = (opt && opt.timeout) || 20000;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    const ctrl = new AbortController();
    const t = setTimeout(function(){ ctrl.abort(); }, timeout);
    try {
      const qs  = new URLSearchParams(Object.assign({ action: action }, params));
      const res = await fetch(API_URL + '?' + qs, { signal: ctrl.signal });
      const data = await res.json();
      clearTimeout(t);
      return data;
    } catch(e) { clearTimeout(t); lastErr = e; }
  }
  throw lastErr;
}
async function apiWrite(action, data) {
  const payload = Object.assign({}, data, { league_id: currentLeague ? currentLeague.league_id : undefined });
  try {
    return await api(action, { data: JSON.stringify(payload) }, { retry: false, timeout: 30000 });
  } catch(e) { return { error: 'network' }; }
}
// เขียนผ่าน POST (ไม่ใช่ querystring) — ต้องใช้ตอนมีรูปแนบ (base64) เพราะ GET มี limit ความยาว URL
// สำคัญ: ห้ามตั้ง header 'Content-Type: application/json' เอง เดี๋ยว browser จะยิง CORS preflight (OPTIONS)
// ซึ่ง Apps Script Web App ไม่รองรับ — ปล่อยให้ fetch ใส่ text/plain ให้เองแบบ default
async function apiPostJSON(action, data, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 30000);
  try {
    const res  = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, data: data }), signal: ctrl.signal });
    const json = await res.json();
    clearTimeout(t);
    return json;
  } catch(e) { clearTimeout(t); return { error: 'network' }; }
}

// ── Knockout Bracket HTML ─────────────────────────────────────
function renderKnockoutBracket(rounds) {
  if (!rounds.length) return '<p class="text-center text-[#4A6152] py-8">ยังไม่มีข้อมูล</p>';
  if (rounds.length === 1) return singleRoundHTML(rounds[0]);
  return `
  <div class="bracket-wrapper pb-4">
    <div class="flex gap-4 items-start" style="min-width:${rounds.length*160}px">
      ${rounds.map(function(r){ return roundColumn(r); }).join('')}
    </div>
  </div>`;
}

function roundColumn(r) {
  return `
  <div class="flex flex-col" style="min-width:148px">
    <p class="bracket-round-label mb-2">${roundDisplayName(r.round)}</p>
    <div class="flex flex-col gap-3 flex-1 justify-around">
      ${r.matches.map(function(m){ return bracketMatchCard(m); }).join('')}
    </div>
  </div>`;
}

function bracketMatchCard(m) {
  const isFT     = m.status==='FT'||m.status==='Finished';
  const hs       = Number(m.home_score), as = Number(m.away_score);
  const homeWin  = isFT && hs > as;
  const awayWin  = isFT && as > hs;
  const homeLogo = logoImgRaw(teamLogo(m.home_team), m.home_team, 20);
  const awayLogo = logoImgRaw(teamLogo(m.away_team), m.away_team, 20);

  return `
  <div class="bracket-match cursor-pointer hover:border-green-500/40 transition" onclick="openModalById('${esc(m.match_id)}')">
    <div class="bracket-team ${homeWin?'winner':awayWin?'loser':''}">
      ${homeLogo}
      <span class="bracket-team-name">${m.home_team}</span>
      <span class="bracket-score ${homeWin?'winner-score':''}">${isFT?hs:'-'}</span>
    </div>
    <div class="bracket-divider"></div>
    <div class="bracket-team ${awayWin?'winner':homeWin?'loser':''}">
      ${awayLogo}
      <span class="bracket-team-name">${m.away_team}</span>
      <span class="bracket-score ${awayWin?'winner-score':''}">${isFT?as:'-'}</span>
    </div>
    ${!isFT&&m.match_date?`<p class="text-[9px] text-[#4A6152] text-center py-1">${formatDate(m.match_date)}</p>`:''}
  </div>`;
}

function singleRoundHTML(r) {
  return `
  <div class="mb-4">
    <p class="font-display font-bold text-xs tracking-widest uppercase text-[#4A6152] px-1 mb-3">${roundDisplayName(r.round)}</p>
    <div class="space-y-2">${r.matches.map(function(m){ return bracketMatchCard(m); }).join('')}</div>
  </div>`;
}

function roundDisplayName(r) {
  const map = { R32:'Round of 32', R16:'Round of 16', QF:'Quarter Final', SF:'Semi Final', '3RD':'3rd Place', F:'FINAL', FINAL:'FINAL' };
  return map[r] || r;
}

let _dt = null;
function debouncedRenderMatches() {
  clearTimeout(_dt);
  _dt = setTimeout(function(){ renderMatches(allMatches); }, 200);
}

function renderMatches(data) {
  const el       = document.getElementById('matches-list');
  const si       = document.getElementById('match-search');
  const search   = ((si && si.value) || '').trim().toLowerCase();
  const n        = new Date();
  const todayStr = n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');

  let filtered = data;
  if (currentFilter==='today')    filtered = data.filter(function(m){ return m.match_date===todayStr; });
  if (currentFilter==='upcoming') filtered = data.filter(function(m){ return m.status!=='FT'&&m.status!=='Finished'; });
  if (currentFilter==='ft')       filtered = data.filter(function(m){ return m.status==='FT'||m.status==='Finished'; });
  if (search) filtered = filtered.filter(function(m){
    return String(m.home_team||'').toLowerCase().includes(search) || String(m.away_team||'').toLowerCase().includes(search);
  });

  if (!filtered.length){el.innerHTML='<p class="text-center text-[#4A6152] py-8">ไม่พบแมตช์</p>';return;}

  const byDate={};
  filtered.forEach(function(m){ const d=m.match_date||'TBD'; if(!byDate[d])byDate[d]=[]; byDate[d].push(m); });

  el.innerHTML = Object.entries(byDate).map(function(kv){
    return `
    <div>
      <p class="text-[10px] font-display font-bold tracking-widest uppercase text-[#4A6152] px-1 mb-2">${formatDate(kv[0])}</p>
      <div class="space-y-2">${kv[1].map(function(m){ return matchCard(m); }).join('')}</div>
    </div>`;
  }).join('');
}

function matchCard(m) {
  const isFT  = m.status==='FT'||m.status==='Finished';
  const isLive= m.status==='LIVE';
  const isKO  = String(m.round_type||'').toLowerCase()==='knockout';
  const badge = isFT
    ? `<span class="text-[10px] font-display font-bold text-[#4A6152] bg-[#1A2420] px-2 py-0.5 rounded">FT</span>`
    : isLive
      ? `<span class="flex items-center gap-1 text-[10px] font-display font-bold text-green-400 bg-green-500/10 px-2 py-0.5 rounded"><span class="live-dot w-1.5 h-1.5 rounded-full bg-green-400 inline-block"></span>LIVE</span>`
      : `<span class="text-[10px] font-display font-bold text-[#4A6152]">${m.match_time||'TBD'}</span>`;
  const roundTag = m.round_type
    ? `<span class="text-[9px] font-display font-bold px-1.5 py-0.5 rounded ${isKO?'bg-yellow-500/15 text-yellow-400':'bg-[#1E2B22] text-[#4A6152]'}">${isKO?(m.group_name||'KO'):'GP-'+m.group_name}</span>`
    : '';
  return `
  <div class="card p-3 cursor-pointer" onclick="openModalById('${esc(m.match_id)}')">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-1.5">${roundTag}<span class="text-[10px] text-[#4A6152] font-display">${m.venue||''}</span></div>
      ${badge}
    </div>
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2 flex-1 min-w-0">
        ${logoImg(teamLogo(m.home_team),m.home_team,32)}
        <span class="font-semibold text-sm truncate">${m.home_team}</span>
      </div>
      <div class="flex items-center gap-1.5 px-3 shrink-0">
        ${isFT||isLive
          ? `<span class="font-display font-black text-xl text-white">${m.home_score}</span><span class="font-display text-[#4A6152] font-bold">:</span><span class="font-display font-black text-xl text-white">${m.away_score}</span>`
          : `<span class="font-display font-bold text-base text-[#2E3D34]">vs</span>`}
      </div>
      <div class="flex items-center gap-2 flex-1 min-w-0 justify-end">
        <span class="font-semibold text-sm truncate text-right">${m.away_team}</span>
        ${logoImg(teamLogo(m.away_team),m.away_team,32)}
      </div>
    </div>
    ${isFT&&m.home_possession&&m.away_possession?`
    <div class="mt-2">
      <div class="flex justify-between text-[10px] text-[#4A6152] mb-0.5"><span>${m.home_possession}%</span><span class="text-[9px] tracking-widest">POSSESSION</span><span>${m.away_possession}%</span></div>
      <div class="flex h-1 rounded-full overflow-hidden bg-[#1E2B22]"><div class="bg-green-500" style="width:${m.home_possession}%"></div><div class="bg-blue-500" style="width:${m.away_possession}%"></div></div>
    </div>`:''}
  </div>`;
}

function filterMatches(f) {

function renderScorers(data) {

  function pRow(p,i,bc,sk) {

      <span class="${bc} text-sm font-black px-3 py-1 rounded-full">${p[sk]}</span>
    </div>`;
  }

  function group(title, icon, arr, sk, bc) {
    const f = arr.filter(function(p){ return p[sk]>0; }).sort(function(a,b){ return b[sk]-a[sk]; });
    if (!f.length) return '';
    const top = f.slice(0,10);
    const ck  = 'stats_'+sk;
    statsCache[ck] = { title: title, icon: icon, players:f, statKey:sk, badgeClass:bc };
    return `
    <div class="mb-5">
      <p class="font-display font-bold text-xs tracking-widest uppercase text-[#4A6152] mb-2 px-1">${icon} ${title}</p>

  el.innerHTML =
    group('Top Scorer','⚽',data,'goals','badge-g') +
    group('Top Assist','🅰',data,'assists','badge-a') +
    group('Top Saves','🧤',data,'saves','badge-a') +
    group('ใบเหลือง','🟨',data,'yellow','badge-y') +
    group('ใบแดง','🟥',data,'red','badge-r') +
    group('Own Goal','🔴',data,'owngoal','badge-r');
}

async function saveScore() {
  if (busy) return;
  const hs=document.getElementById('home-score').value;
  const as=document.getElementById('away-score').value;
  const status=document.getElementById('match-status').value;
  const hp=document.getElementById('home-possession') ? document.getElementById('home-possession').value : '';
  const ap=document.getElementById('away-possession') ? document.getElementById('away-possession').value : '';
  if(hs===''||as===''){showToast('กรุณากรอกคะแนนก่อน');return;}

  const btn = document.getElementById('btn-save-score');
  busy = true; btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  const lid = currentLeague ? currentLeague.league_id : null;
  try {
    const res = await apiWrite('saveMatchResult',{
      match_id:activeModal.match_id,home_score:Number(hs),away_score:Number(as),
      status:status,home_possession:hp,away_possession:ap,
    });
    if(res && res.success){
      const m=allMatches.find(function(m){ return String(m.match_id)===String(activeModal.match_id); });
      if(m){m.home_score=Number(hs);m.away_score=Number(as);m.status=status;if(hp)m.home_possession=Number(hp);if(ap)m.away_possession=Number(ap);}
      showToast('บันทึกผลสำเร็จ ✅');
      closeModalById('match-modal');
      const ckey='lh_'+lid; lsDel(ckey);
      try {
        const fd=await api('getInitialData',{leagueId:lid});
        if(fd&&!fd.error&&currentLeague&&String(currentLeague.league_id)===String(lid)){applyData(fd);lsSet(ckey,JSON.stringify(fd));}
      } catch(e){}
    } else { showToast('เกิดข้อผิดพลาด ❌ ตรวจสัญญาณแล้วลองอีกครั้ง'); }
  } finally {
    busy = false;
    const b = document.getElementById('btn-save-score');
    if (b) { b.disabled = false; b.textContent = 'บันทึกผลการแข่งขัน'; }
  }
}

// สถิติรายแมตช์: จับกลุ่ม event ของผู้เล่นตาม match_id แล้วโชว์ว่าแต่ละแมตช์ทำอะไรไปบ้าง
// (รวมแมตช์ถ้วยในวันเดียวกันด้วย เพราะ getTopScorers นับรวมไว้)
const EV_META = {
  goal:    { icon:'⚽', cls:'badge-g', label:'ประตู' },
  assist:  { icon:'🅰', cls:'badge-a', label:'แอสซิสต์' },
  save:    { icon:'🧤', cls:'badge-a', label:'เซฟ' },
  yellow:  { icon:'🟨', cls:'badge-y', label:'ใบเหลือง' },
  red:     { icon:'🟥', cls:'badge-r', label:'ใบแดง' },
  owngoal: { icon:'🔴', cls:'badge-r', label:'เข้าประตูตัวเอง' },
};
function renderPlayerMatchBreakdown(p, events) {
  const head = '<p class="font-display font-bold text-xs tracking-widest uppercase text-[#4A6152] mt-5 mb-2 px-1">📋 สถิติรายแมตช์</p>';
  if (!events.length) return head + '<p class="text-xs text-[#4A6152] px-1 pb-2">ยังไม่มีสถิติ</p>';

  const byMatch = {}, order = [];
  events.forEach(function(ev){
    const k = String(ev.match_id);
    if (!byMatch[k]) { byMatch[k] = { info: ev, evs: [] }; order.push(k); }
    byMatch[k].evs.push(ev);
  });
  order.sort(function(a,b){
    const da = String(byMatch[a].info.match_date||''), db = String(byMatch[b].info.match_date||'');
    if (da !== db) return da < db ? 1 : -1;                  // ล่าสุดขึ้นก่อน
    return a < b ? 1 : -1;
  });

  const curLid = currentLeague ? String(currentLeague.league_id) : '';
  const typeOrder = ['goal','assist','save','owngoal','yellow','red'];

  return head + '<div class="space-y-2 pb-2">' + order.map(function(k){
    const g = byMatch[k], m = g.info;
    const inThisLeague = allMatches.some(function(x){ return String(x.match_id) === k; });
    const isOtherLeague = m.league_id && String(m.league_id) !== curLid;
    const hs = m.home_score === '' || m.home_score == null ? '-' : m.home_score;
    const as = m.away_score === '' || m.away_score == null ? '-' : m.away_score;
    const homeMine = m.home_team === p.team_name, awayMine = m.away_team === p.team_name;

    const counts = {}, times = {};
    g.evs.forEach(function(ev){
      const t = String(ev.type||'').toLowerCase();
      counts[t] = (counts[t]||0) + 1;
      if (ev.time !== '' && ev.time != null) { (times[t] = times[t] || []).push(String(ev.time)); }
    });
    const chips = typeOrder.concat(Object.keys(counts).filter(function(t){ return typeOrder.indexOf(t) < 0; }))
      .filter(function(t){ return counts[t]; })
      .map(function(t){
        const meta = EV_META[t] || { icon:'•', cls:'badge-a', label:t };
        const tm = times[t] ? ' <span class="opacity-70">(' + times[t].map(function(x){ return ea(x) + "'"; }).join(', ') + ')</span>' : '';
        return `<span class="${meta.cls} text-[10px] font-bold px-2 py-0.5 rounded-full" title="${ea(meta.label)}">${meta.icon} ×${counts[t]}${tm}</span>`;
      }).join('');

    return `
    <div class="card p-3 ${inThisLeague ? 'cursor-pointer hover:border-green-500/30' : ''}" ${inThisLeague ? `onclick="closeModalById('player-modal');openModalById('${esc(k)}')"` : ''}>
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[10px] text-[#4A6152]">${m.match_date ? formatDate(m.match_date) : 'TBD'} · ${ea(k)}</span>
        ${isOtherLeague ? `<span class="badge-y text-[9px] font-bold px-1.5 py-0.5 rounded-full">🏆 ถ้วย${m.group_name ? ' ' + ea(m.group_name) : ''}</span>` : ''}
      </div>
      <div class="flex items-center gap-2 text-xs mb-2">
        <span class="flex-1 truncate text-right ${homeMine ? 'text-white font-bold' : 'text-[#4A6152]'}">${ea(m.home_team || '?')}</span>
        <span class="font-display font-black text-sm text-white shrink-0">${ea(hs)} - ${ea(as)}</span>
        <span class="flex-1 truncate ${awayMine ? 'text-white font-bold' : 'text-[#4A6152]'}">${ea(m.away_team || '?')}</span>
      </div>
      <div class="flex flex-wrap gap-1">${chips}</div>
    </div>`;
  }).join('') + '</div>';
}

  editingPlayerId = null;
  editingTeamName = teamName;
  editingLeagueId = currentLeague ? currentLeague.league_id : null;
  pendingPhoto = null;
  renderPlayerForm({ player_name:'', player_number:'', birth_year:'', player_image:'' });
  document.getElementById('player-form-modal').classList.add('open');
}

function openEditPlayerForm(playerId) {
  const p = allPlayers.find(function(x){ return String(x.player_id) === String(playerId); });
  if (!p) { showToast('ไม่พบข้อมูลผู้เล่น'); return; }
  editingPlayerId = p.player_id;
  editingTeamName = p.team_name;
  editingLeagueId = currentLeague ? currentLeague.league_id : null;
  pendingPhoto = null;
  renderPlayerForm(p);
  document.getElementById('player-form-modal').classList.add('open');
}

async function handlePhotoSelect(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const result = await resizeImageToBase64(file, 800, 0.75);
    pendingPhoto = result;
    const prev = document.getElementById('pf-photo-preview');
    if (prev) prev.innerHTML = `<img src="${result.dataUrl}" class="w-full h-full object-cover"/>`;
  } catch(err) { showToast('อ่านรูปไม่สำเร็จ ลองใหม่อีกครั้ง'); }
}

// ย่อรูปด้วย canvas ก่อนอัปโหลด กันไฟล์ใหญ่เกินไป (กล้องมือถือมักได้รูป 3-10MB)
function resizeImageToBase64(file, maxDim, quality) {
  return new Promise(function(resolve, reject) {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read fail')); };
    reader.onload = function() {
      img.onerror = function(){ reject(new Error('decode fail')); };
      img.onload = function() {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitPlayerForm() {
  if (busy) return;
  const nameEl = document.getElementById('pf-name');
  const name   = nameEl.value.trim();
  const number = document.getElementById('pf-number').value.trim();
  const year   = document.getElementById('pf-year').value.trim();
  if (!name) { showToast('กรุณากรอกชื่อนักกีฬา'); return; }
  if (!editingLeagueId) { showToast('ไม่พบข้อมูลลีก กรุณาเปิดหน้าใหม่แล้วลองอีกครั้ง'); return; }

  const btn = document.getElementById('pf-save-btn');
  busy = true; btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  const payload = {
    player_id:     editingPlayerId || '',
    player_name:   name,
    player_number: number,
    birth_year:    year,
    team_name:     editingTeamName,
    league_id:     editingLeagueId,
  };
  if (pendingPhoto) { payload.image_base64 = pendingPhoto.base64; payload.image_mime = pendingPhoto.mime; }

  try {
    const res = await apiPostJSON('savePlayer', payload, 45000);
    if (res && res.success) {
      showToast(editingPlayerId ? 'แก้ไขสำเร็จ ✅' : 'เพิ่มนักกีฬาสำเร็จ ✅');
      closeModalById('player-form-modal');
      const lid = editingLeagueId, teamForReopen = editingTeamName;
      const ckey = 'lh_' + lid;
      lsDel(ckey);
      try {
        const fd = await api('getInitialData', { leagueId: lid });
        if (fd && !fd.error && currentLeague && String(currentLeague.league_id) === String(lid)) {
          applyData(fd);
          lsSet(ckey, JSON.stringify(fd));
          openTeamModal(teamForReopen);
        }
      } catch(e) {}
    } else {
      showToast('เกิดข้อผิดพลาด ❌ ' + (res && res.error ? res.error : 'ลองอีกครั้ง'));
    }
  } finally {
    busy = false;
    const b = document.getElementById('pf-save-btn');
    if (b) { b.disabled = false; b.textContent = 'บันทึก'; }
  }
}

// EXPORT รูปรายชื่อทีม — วาดลง canvas เอง (กว้าง 1080px, สูงเท่าที่จำเป็น)
// รูปนักกีฬาดึงผ่าน server (getImagesBase64) เพราะ Drive ไม่เปิด CORS → วาดตรงๆ แล้ว export ไม่ได้
// รูปทุกใบ crop แบบ cover (ตัดขอบ ไม่ยืด/บีบ) สัดส่วนจึงไม่เพี้ยน
// ============================================================
let exportBlob = null, exportBlobUrl = null, exportFileName = 'roster.jpg', exportSeq = 0;

function setExportContent(html) { document.getElementById('export-content').innerHTML = html; }

async function exportTeamImage(teamName) {
  const seq = ++exportSeq;
  document.getElementById('export-modal').classList.add('open');
  setExportContent(`
    <p class="font-display font-bold text-sm tracking-widest uppercase text-[#4A6152] mb-4 mt-2">Export รายชื่อทีม</p>
    <div class="py-10 text-center"><div class="shimmer h-2.5 w-40 mb-3" style="margin-left:auto;margin-right:auto"></div>
      <p class="text-sm text-[#E8F5E9]">กำลังสร้างรูป...</p>
      <p class="text-[10px] text-[#4A6152] mt-1">กำลังดึงรูปนักกีฬาทั้งทีม อาจใช้เวลา 5-20 วินาที</p></div>`);

  const team    = allTeams.find(function(t){ return t.team_name === teamName; }) || { team_name: teamName };
  const players = allPlayers.filter(function(p){ return p.team_name === teamName; });
  const rec = { W:0, D:0, L:0, F:0, A:0 };
  allMatches.filter(function(m){ return (m.status==='FT'||m.status==='Finished')&&(m.home_team===teamName||m.away_team===teamName); })
    .forEach(function(m){
      const hs=Number(m.home_score), as=Number(m.away_score), ih=m.home_team===teamName;
      const gf=ih?hs:as, ga=ih?as:hs; rec.F+=gf; rec.A+=ga;
      if(gf>ga)rec.W++; else if(gf<ga)rec.L++; else rec.D++;
    });

  try {
    const urls = [team.logo].concat(players.map(function(p){ return p.player_image; }))
      .filter(function(u){ return !!u; });
    let images = {}, photoWarn = false;
    if (urls.length) {
      const res = await apiPostJSON('getImagesBase64', { urls: urls, size: 400 }, 60000);
      if (res && res.images) images = res.images; else photoWarn = true;
    }
    if (seq !== exportSeq) return;                 // ผู้ใช้กด export ทีมอื่นซ้อนไปแล้ว

    await ensureExportFonts();
    const loaded = {};
    await Promise.all(Object.keys(images).map(function(u){
      if (!images[u]) { photoWarn = true; return null; }
      return loadImage(images[u]).then(function(im){ loaded[u] = im; }).catch(function(){ photoWarn = true; });
    }));
    if (seq !== exportSeq) return;

    const canvas = drawRosterCanvas(team, players, rec, loaded);
    const blob = await canvasToBlob(canvas, 'image/jpeg', 0.92);
    if (seq !== exportSeq) return;

    if (exportBlobUrl) { try { URL.revokeObjectURL(exportBlobUrl); } catch(e){} }
    exportBlob = blob;
    exportBlobUrl = URL.createObjectURL(blob);
    exportFileName = String(teamName).replace(/[\\\/:*?"<>|\s]+/g, '_') + '_roster.jpg';
    const canShare = !!(navigator.canShare && window.File && navigator.canShare({ files: [new File([blob], exportFileName, { type: 'image/jpeg' })] }));

    setExportContent(`
      <p class="font-display font-bold text-sm tracking-widest uppercase text-[#4A6152] mb-3 mt-2">Export รายชื่อทีม</p>
      ${photoWarn ? '<p class="text-[10px] text-yellow-400 mb-2">⚠️ บางรูปโหลดไม่ได้ ใช้ตัวย่อชื่อแทน</p>' : ''}
      <img src="${exportBlobUrl}" alt="roster" class="w-full rounded-xl border border-[#1E2B22] mb-3"/>
      <div class="grid ${canShare ? 'grid-cols-2' : 'grid-cols-1'} gap-2">
        <a href="${exportBlobUrl}" download="${ea(exportFileName)}" class="block text-center bg-green-500 hover:bg-green-400 text-black font-bold font-display py-2.5 rounded-xl transition">⬇ บันทึกรูป</a>
        ${canShare ? '<button onclick="shareExportImage()" class="border border-green-500/30 text-green-400 font-bold font-display py-2.5 rounded-xl transition">📤 แชร์</button>' : ''}
      </div>
      <p class="text-[10px] text-[#4A6152] mt-3 leading-tight">ถ้าเปิดผ่าน LINE แล้วกดบันทึกไม่ได้: กดค้างที่รูป → บันทึกรูปภาพ หรือเปิดลิงก์นี้ใน Chrome / Safari</p>`);
  } catch(err) {
    if (seq !== exportSeq) return;
    setExportContent(`
      <p class="font-display font-bold text-sm tracking-widest uppercase text-[#4A6152] mb-3 mt-2">Export รายชื่อทีม</p>
      <p class="text-sm text-red-400 py-6 text-center">สร้างรูปไม่สำเร็จ ลองอีกครั้ง</p>
      <button onclick="exportTeamImage('${esc(teamName)}')" class="w-full border border-green-500 text-green-400 font-bold font-display py-2.5 rounded-xl">ลองใหม่</button>`);
  }
}

async function shareExportImage() {
  if (!exportBlob) return;
  try {
    await navigator.share({ files: [new File([exportBlob], exportFileName, { type: 'image/jpeg' })], title: exportFileName });
  } catch(e) { /* ผู้ใช้กดยกเลิก */ }
}

function loadImage(src) {
  return new Promise(function(resolve, reject){
    const im = new Image();
    im.onload = function(){ resolve(im); };
    im.onerror = function(){ reject(new Error('img')); };
    im.src = src;
  });
}

function canvasToBlob(canvas, type, q) {
  return new Promise(function(resolve, reject){
    if (canvas.toBlob) {
      canvas.toBlob(function(b){ if (b) resolve(b); else reject(new Error('blob')); }, type, q);
    } else {
      try {
        const d = canvas.toDataURL(type, q), bin = atob(d.split(',')[1]), arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        resolve(new Blob([arr], { type: type }));
      } catch(e) { reject(e); }
    }
  });
}

// รอฟอนต์ Kanit / Barlow Condensed ให้โหลดก่อนวาด (ไม่งั้นตัวหนังสือในรูปจะเป็นฟอนต์ระบบ) — รอไม่เกิน 3 วิ
function ensureExportFonts() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const list = ['900 64px Kanit','700 32px Kanit','600 28px Kanit','400 28px Kanit','900 40px "Barlow Condensed"','700 28px "Barlow Condensed"'];
  const all = Promise.all(list.map(function(f){ return document.fonts.load(f, 'กขABC123').catch(function(){}); }));
  return Promise.race([all, new Promise(function(r){ setTimeout(r, 3000); })]);
}

function rrPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

// วาดรูปแบบ object-fit: cover (crop กึ่งกลาง ไม่ยืดภาพ)
function drawCover(ctx, img, x, y, w, h) {
  const ir = img.width / img.height, r = w / h;
  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if (ir > r) { sw = img.height * r; sx = (img.width - sw) / 2; }
  else        { sh = img.width / r;  sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function fitText(ctx, text, maxW) {
  text = String(text == null ? '' : text);
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text + '…';
}

function drawRosterCanvas(team, players, rec, loaded) {
  const W = 1080, PAD = 48, GAP = 24, COLS = 3;
  const cardW = Math.floor((W - PAD * 2 - GAP * (COLS - 1)) / COLS);     // 312
  const PHOTO_IN = 14, photo = cardW - PHOTO_IN * 2;                      // 284
  const cardH = PHOTO_IN + photo + 16 + 34 + 6 + 34 + 18;
  const HEADER_H = 650, FOOTER_H = 110;
  const rows = Math.ceil(players.length / COLS);
  const gridH = players.length ? rows * cardH + (rows - 1) * GAP : 120;
  const H = HEADER_H + gridH + FOOTER_H;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const KANIT = 'Kanit, "Noto Sans Thai", sans-serif', BARLOW = '"Barlow Condensed", Kanit, sans-serif';

  // พื้นหลัง + แสงเขียวด้านบน
  ctx.fillStyle = '#0A0F0D'; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, 700);
  glow.addColorStop(0, 'rgba(0,200,83,0.22)'); glow.addColorStop(1, 'rgba(0,200,83,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, 700);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

  // โลโก้ทีม
  const LOGO = 180, lx = (W - LOGO) / 2, ly = 64;
  ctx.save();
  ctx.beginPath(); ctx.arc(W / 2, ly + LOGO / 2, LOGO / 2, 0, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = '#111916'; ctx.fill(); ctx.clip();
  const logoImg = team.logo && loaded[team.logo];
  if (logoImg) drawCover(ctx, logoImg, lx, ly, LOGO, LOGO);
  else { ctx.fillStyle = '#00C853'; ctx.font = '900 72px ' + BARLOW; ctx.textBaseline = 'middle'; ctx.fillText(initials(team.team_name), W / 2, ly + LOGO / 2 + 4); ctx.textBaseline = 'alphabetic'; }
  ctx.restore();
  ctx.beginPath(); ctx.arc(W / 2, ly + LOGO / 2, LOGO / 2 - 2, 0, Math.PI * 2);
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,200,83,0.45)'; ctx.stroke();

  // ชื่อทีม (ย่อขนาดฟอนต์อัตโนมัติถ้ายาว)
  let fs = 64;
  ctx.font = '900 ' + fs + 'px ' + KANIT;
  while (fs > 36 && ctx.measureText(team.team_name).width > W - PAD * 2) { fs -= 2; ctx.font = '900 ' + fs + 'px ' + KANIT; }
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(fitText(ctx, team.team_name, W - PAD * 2), W / 2, 330);

  ctx.font = '400 28px ' + KANIT; ctx.fillStyle = '#7C9A85';
  ctx.fillText(fitText(ctx, currentLeague ? currentLeague.league_name : '', W - PAD * 2), W / 2, 378);

  // สถิติทีม W D L GF-GA
  const boxes = [[rec.W, 'W', '#4ADE80'], [rec.D, 'D', '#7C9A85'], [rec.L, 'L', '#F87171'], [rec.F + '-' + rec.A, 'GF-GA', '#FFFFFF']];
  const bw = 200, bh = 112, bg = 20, bx0 = (W - (bw * 4 + bg * 3)) / 2, by = 420;
  boxes.forEach(function(b, i){
    const x = bx0 + i * (bw + bg);
    rrPath(ctx, x, by, bw, bh, 18); ctx.fillStyle = '#111916'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#1E2B22'; ctx.stroke();
    ctx.fillStyle = b[2]; ctx.font = '900 48px ' + BARLOW; ctx.fillText(String(b[0]), x + bw / 2, by + 62);
    ctx.fillStyle = '#4A6152'; ctx.font = '700 22px ' + BARLOW; ctx.fillText(b[1], x + bw / 2, by + 94);
  });

  // หัวข้อรายชื่อ
  ctx.textAlign = 'left';
  ctx.fillStyle = '#00C853'; rrPath(ctx, PAD, 582, 8, 36, 4); ctx.fill();
  ctx.fillStyle = '#E8F5E9'; ctx.font = '700 32px ' + KANIT;
  ctx.fillText('รายชื่อนักกีฬา', PAD + 22, 612);
  const tw = ctx.measureText('รายชื่อนักกีฬา').width;
  ctx.fillStyle = '#4A6152'; ctx.font = '400 28px ' + KANIT;
  ctx.fillText(players.length + ' คน', PAD + 22 + tw + 16, 612);

  // การ์ดนักกีฬา
  ctx.textAlign = 'center';
  if (!players.length) {
    ctx.fillStyle = '#4A6152'; ctx.font = '400 28px ' + KANIT;
    ctx.fillText('ยังไม่มีผู้เล่น', W / 2, HEADER_H + 70);
  }
  players.forEach(function(p, i){
    const c = i % COLS, r = Math.floor(i / COLS);
    const x = PAD + c * (cardW + GAP), y = HEADER_H + r * (cardH + GAP);
    rrPath(ctx, x, y, cardW, cardH, 20); ctx.fillStyle = '#111916'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#1E2B22'; ctx.stroke();

    const px = x + PHOTO_IN, py = y + PHOTO_IN;
    ctx.save(); rrPath(ctx, px, py, photo, photo, 14); ctx.fillStyle = '#0A0F0D'; ctx.fill(); ctx.clip();
    const im = p.player_image && loaded[p.player_image];
    if (im) drawCover(ctx, im, px, py, photo, photo);
    else { ctx.fillStyle = '#00C853'; ctx.font = '900 96px ' + BARLOW; ctx.textBaseline = 'middle'; ctx.fillText(initials(p.player_name), px + photo / 2, py + photo / 2 + 4); ctx.textBaseline = 'alphabetic'; }
    ctx.restore();

    ctx.fillStyle = '#FFFFFF'; ctx.font = '600 28px ' + KANIT;
    ctx.fillText(fitText(ctx, p.player_name, cardW - 24), x + cardW / 2, py + photo + 16 + 28);
    ctx.fillStyle = '#4ADE80'; ctx.font = '700 30px ' + BARLOW;
    ctx.fillText(p.player_number !== '' && p.player_number != null ? '#' + p.player_number : '#-', x + cardW / 2, py + photo + 16 + 34 + 6 + 28);
  });

  // footer
  const fy = HEADER_H + gridH + 64;
  ctx.fillStyle = '#1E2B22'; ctx.fillRect(PAD, fy - 44, W - PAD * 2, 2);
  ctx.fillStyle = '#4A6152'; ctx.font = '400 22px ' + KANIT;
  let today = '';
  try { today = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }); } catch(e) {}
  ctx.fillText('7SOC  ·  ข้อมูล ณ ' + today, W / 2, fy);
  return cv;
}

// ขอรูป Drive ขนาดพอดีกับที่แสดงจริง (server ส่งมา sz=w200 เสมอ)
function thumb(url,w){ return String(url).replace(/([?&]sz=)w\d+/, '$1w'+w); }
function ea(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// <img> มาตรฐาน: lazy + async decode + ถ้าโหลดไม่ขึ้น (เช่น Drive จำกัดโควตา) ให้แสดงตัวย่อแทนรูปเสีย
function imgTag(url,w,cls,style,ini,fs){
  return `<img src="${ea(thumb(url,w))}"${cls?` class="${cls}"`:''}${style?` style="${style}"`:''} alt="" loading="lazy" decoding="async" data-i="${ea(ini)}" data-fs="${fs||''}" onerror="imgFail(this)"/>`;
}
function imgFail(im){
  const d=document.createElement('div');
  d.className='logo-fallback';
  d.textContent=im.getAttribute('data-i')||'?';
  const fs=im.getAttribute('data-fs'); if(fs) d.style.fontSize=fs;
  im.parentNode.replaceChild(d,im);
}

function logoImg(url,name,size,k){
  k=k||.35;
  const fs=Math.round(size*k)+'px';
  const s=`width:${size}px;height:${size}px;border-radius:${size/2}px;overflow:hidden;background:#0A0F0D;border:1px solid #1E2B22;flex-shrink:0;`;
  if(url) return `<div style="${s}">${imgTag(url,size>32?128:96,'','width:100%;height:100%;object-fit:cover;',initials(name),fs)}</div>`;
  return `<div style="${s}display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:${fs};color:#00C853;">${initials(name)}</div>`;
}
function logoImgRaw(url,name,size){ return logoImg(url,name,size,.4); }

// ตัวย่อแทนรูป: ตัดส่วนหลัง "/" (เช่น "เอก / 28") / ชื่ออังกฤษใช้อักษรแรกของแต่ละคำ
// ชื่อไทยใช้ 2 ตัวแรกของคำแรก โดยไม่นับสระบน-ล่าง/วรรณยุกต์ (ไม่ให้ตัดกลางตัวอักษร)
function initials(name){
  if(!name) return '?';
  const base = String(name).split('/')[0].trim() || String(name).trim();
  const words = base.split(/\s+/).filter(function(w){ return w; });
  if (!words.length) return '?';
  if (/^[A-Za-z0-9]/.test(base)) return words.map(function(w){ return w[0]; }).join('').toUpperCase().slice(0,2);
  const w = words[0]; let out = '', n = 0;
  for (let i = 0; i < w.length; i++) {
    const c = w.charCodeAt(i);
    const mark = c === 0x0E31 || (c >= 0x0E34 && c <= 0x0E3A) || (c >= 0x0E47 && c <= 0x0E4E);
    if (!mark) { if (n >= 2) break; n++; }
    out += w[i];
  }
  return out;
}
// ใช้ใน onclick="fn('...')" — escape \ ' " ให้ปลอดภัยแม้ชื่อทีมมีเครื่องหมายพิเศษ
function esc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function formatDate(ds){
  if(!ds||ds==='TBD')return'TBD';
  try{ const p=ds.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('th-TH',{weekday:'short',month:'short',day:'numeric'}); }
  catch(e){return ds;}
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(showToast._t);
  showToast._t=setTimeout(function(){ t.style.opacity='0'; },2200);
}
